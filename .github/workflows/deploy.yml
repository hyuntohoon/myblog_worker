# .github/workflows/deploy.yml
name: Deploy Worker Lambda

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: default GITHUB_TOKEN is too broad; this workflow only needs to read the repo.
permissions:
  contents: read

# Serialize prod deploys so out-of-order pushes can't overwrite a newer Lambda with an older build.
concurrency:
  # A PR check and a prod deploy are not the same thing and must not share a queue.
  # They did until 2026-08-02. Only ONE run may sit *pending* in a concurrency group,
  # so a PR run that queued while a deploy was in flight was cancelled before it ran a
  # single job — and a cancelled run reports **no check at all** on the PR, not a red
  # one. A missing gate reads like "nothing to wait for", which is the dangerous shape:
  # the merge rule requires green CI, and absent CI can be mistaken for satisfied CI.
  # (Observed on front #333; the PR run died with zero jobs at 08:02:21Z behind the
  # deploy of the preceding merge. Rare until now — it needs a deploy in flight at the
  # moment a PR queues — but concurrent sessions make that ordinary.)
  #
  # Prod deploys stay serialized under the single group they always had.
  # PR runs get one group per PR and supersede themselves, so a fixup push cancels the
  # older run of the SAME PR (wanted) and nothing else (the bug).
  group: ${{ github.event_name == 'pull_request' && format('worker-pr-{0}', github.event.number) || 'worker-deploy-prod' }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: myblog_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d myblog_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check out canonical shared-db schema
        uses: actions/checkout@v4
        with:
          repository: hyuntohoon/myblog_shared_db
          ref: 90a6fca4a0528a0ed37be3a514e86ad379373042
          token: ${{ secrets.SHARED_DB_PAT }}
          persist-credentials: false
          path: shared-db-schema

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install -r requirements-test.txt

      - name: Load canonical schema and deterministic fixtures
        env:
          POSTGRES_CONTAINER_ID: ${{ job.services.postgres.id }}
        run: |
          docker exec -i "$POSTGRES_CONTAINER_ID" \
            psql -U postgres -d myblog_test --set ON_ERROR_STOP=on \
            < shared-db-schema/tests/canonical_schema.sql
          docker exec -i "$POSTGRES_CONTAINER_ID" \
            psql -U postgres -d myblog_test --set ON_ERROR_STOP=on \
            < tests/integration/fixtures/catalog.sql

      - name: Run tests
        env:
          TEST_DB_URL: postgresql+psycopg://postgres:postgres@localhost:5432/myblog_test
          SPOTIFY_CLIENT_ID: "test"
          SPOTIFY_CLIENT_SECRET: "test"
          DRY_RUN: "true"
        run: >-
          pytest tests/ -v
          --alluredir=allure-results
          --junitxml=pytest-results.xml

      - name: Enforce zero DB-bound skips
        run: |
          python - <<'PY'
          import json
          import sys
          import xml.etree.ElementTree as ET

          allowed_suffix = "integration/test_musicbrainz_live.py"
          testcases = ET.parse("pytest-results.xml").findall(".//testcase")
          skipped = [case for case in testcases if case.find("skipped") is not None]
          allowed_live = []
          unexpected = []

          for case in skipped:
              source = case.get("file")
              if not source:
                  source = case.get("classname", "").replace(".", "/") + ".py"
              source = source.removeprefix("./")
              record = f"{source}::{case.get('name', '<unknown>')}"
              if source == allowed_suffix or source.endswith("/" + allowed_suffix):
                  allowed_live.append(record)
              else:
                  unexpected.append(record)

          evidence = {
              "collected": len(testcases),
              "skipped_total": len(skipped),
              "allowed_musicbrainz_live_skips": len(allowed_live),
              "db_bound_skips": len(unexpected),
          }
          print(json.dumps(evidence, sort_keys=True))
          print("DB-bound skips: 0" if not unexpected else "DB-bound skips detected")

          if len(allowed_live) != 3:
              print(
                  f"::error::Expected 3 intentional MusicBrainz live skips, got {len(allowed_live)}",
                  file=sys.stderr,
              )
              sys.exit(1)
          if unexpected:
              print(
                  "::error::Unexpected skipped tests: " + ", ".join(unexpected),
                  file=sys.stderr,
              )
              sys.exit(1)
          PY

      - name: Upload Allure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results
          path: allure-results/

      - name: Upload JUnit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: pytest-results.xml

  deploy:
    needs: test
    # Production deploy is main-only. push already filters to main (on.push.branches), but
    # workflow_dispatch can be invoked against ANY ref, so guard the ref explicitly — otherwise
    # a dispatch from a feature branch would ship that branch's code to prod.
    if: >-
      (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
      && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # Job-level permissions REPLACE the workflow-level block, so `contents: read`
    # is restated here rather than inherited. `id-token: write` is what lets this
    # job mint the OIDC token it trades for the AWS role, and it is granted to this
    # job ONLY — the test/check jobs run on every pull request and must not be able
    # to request one.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git auth for private package
        env:
          SHARED_DB_PAT: ${{ secrets.SHARED_DB_PAT }}
        run: git config --global url."https://${SHARED_DB_PAT}@github.com/".insteadOf "https://github.com/"

      - name: Build zip
        run: |
          mkdir -p build
          pip install -r requirements.txt -t build \
            --platform manylinux2014_aarch64 --only-binary=:all:
          cp -r worker build/
          find build -name "__pycache__" -exec rm -rf {} +
          find build -name "*.pyc" -delete
          cd build && zip -r ../bundle.zip .

      # SEC-system-hardening Step 3c: OIDC, not a long-lived key. The role's trust
      # policy pins `sub` AND `job_workflow_ref` with StringEquals, so only this
      # workflow file on this repo's main can assume it — `sub` alone would also
      # match a pull_request_target run, whose GITHUB_REF is the base branch. The
      # role can call exactly the Lambda actions below on ONE function; the shared
      # github-actions-deploy user it replaces could write four.
      #
      # AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY remain set and are now unused;
      # they are deleted only after this lane is confirmed green in production.
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-worker-deploy-${{ github.run_id }}
          aws-region: ap-northeast-2

      - name: Deploy to Lambda
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || 'blogWorkerLambda' }}
        run: |
          aws lambda update-function-code \
            --function-name "$FUNCTION_NAME" \
            --zip-file fileb://bundle.zip \
            --architectures arm64

      # OPS-delivery-safety-gates Step 3 — post-deploy health smoke. The worker has
      # no HTTP surface, so health = wait for the new code to go live, then invoke
      # with an empty event. An empty `{}` matches no job/source/Records branch, so
      # the handler returns {"batchItemFailures": []} as a pure no-op (no DB, no
      # external calls) — a FunctionError here means the deployed bundle fails to
      # import/enter, i.e. roll back. Code is already live, so this is
      # detect-and-alert-fast + rollback trigger, not a pre-cutover gate.
      - name: Post-deploy smoke (health invoke)
        env:
          FUNCTION_NAME: ${{ vars.LAMBDA_FUNCTION_NAME || 'blogWorkerLambda' }}
        run: |
          # function-updated-v2 polls GetFunction; the v1 waiter polls
          # GetFunctionConfiguration, which neither the old lambda-deploy-only user
          # policy nor the OIDC role that replaced it allows. Keep the v2 waiter.
          # GetFunction and InvokeFunction are granted on THIS function only —
          # infra/github_oidc.tf, myblog-github-worker-deploy.
          aws lambda wait function-updated-v2 --function-name "$FUNCTION_NAME"
          aws lambda invoke \
            --function-name "$FUNCTION_NAME" \
            --cli-binary-format raw-in-base64-out \
            --payload '{}' \
            /tmp/worker-out.json > /tmp/worker-invoke.json
          echo "invoke metadata:"; cat /tmp/worker-invoke.json; echo
          echo "payload response:"; cat /tmp/worker-out.json; echo
          if grep -q '"FunctionError"' /tmp/worker-invoke.json; then
            echo "::error::Worker health invoke returned a FunctionError — the deployed bundle is broken (import/entry failure). Roll back the deploy."
            exit 1
          fi
          echo "Worker health OK (empty-event invoke, no FunctionError)."
