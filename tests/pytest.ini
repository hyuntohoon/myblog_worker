[pytest]
testpaths = tests
python_files = test_*.py
python_functions = test_*
addopts = -v --tb=short
markers =
    unit: 단위 테스트 (DB 없이)
    integration: 통합 테스트 (DB 연동)
    pause_check: runs the real owner-pause check instead of the autouse stub
    rejections: runs the real lyrics rejection read instead of the autouse stub
